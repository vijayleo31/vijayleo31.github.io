# ── Build Settings ───────────────────────────────────────
theme:        jekyll-theme-minimal
markdown:     kramdown
highlighter:  rouge
permalink:    pretty

kramdown:
  input:               GFM
  hard_wrap:           false
  syntax_highlighter:  rouge

# Sass (if adding custom stylesheets alongside the HTML)
sass:
  style:            compressed
  sass_dir:         _sass


# ── Plugins ──────────────────────────────────────────────
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed


# ── File Exclusions ──────────────────────────────────────
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - "*.sh"
  - .DS_Store
  - .gitignore

include:
  - index.html
  - _config.yml
  - assets/
