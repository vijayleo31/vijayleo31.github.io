# ── Typography (Google Fonts used in site) ───────────────
fonts:
  headings:     "Playfair Display"   # weights: 400, 600, 700, 800
  body:         "Raleway"            # weights: 300, 400, 500, 600, 700
  descriptions: "EB Garamond"        # weights: 400, 500, 600
  monospace:    "DM Mono"            # weights: 400, 500
  google_fonts_url: >
    https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800
    &family=EB+Garamond:wght@400;500;600
    &family=DM+Mono:wght@400;500
    &family=Raleway:wght@300;400;500;600;700
    &display=swap


# ── Theme & Appearance ───────────────────────────────────
theme_config:
  default_mode:    "dark"        # dark | light (user can toggle)
  color_primary:   "#ff2233"     # red accent
  color_bg_dark:   "#000000"
  color_bg_light:  "#fdf5f5"
  border_radius:   "0"           # sharp edges — minimal/tech aesthetic
  enable_3d_bg:    true          # Three.js particle + wireframe background
  enable_globe:    true          # rotating globe in Global Impact section
  custom_cursor:   true          # custom red ring cursor


